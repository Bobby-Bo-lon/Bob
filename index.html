<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💌 Heart Letter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1a0a10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
    }
    .bg-hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .bg-heart { position: absolute; opacity: 0; animation: bgFloat linear infinite; }
    @keyframes bgFloat {
      0%   { transform: translateY(110vh) scale(0.5); opacity: 0; }
      10%  { opacity: 0.3; }
      90%  { opacity: 0.1; }
      100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
    }
    .login-screen {
      background: linear-gradient(145deg, #fff0f4, #fde0ea);
      border-radius: 24px; width: 320px; padding: 2.5rem 2rem;
      text-align: center; border: 1.5px solid #f7b8cc;
      box-shadow: 0 0 0 6px rgba(220,80,120,0.08), 0 20px 60px rgba(180,40,80,0.25);
      z-index: 10; position: relative;
    }
    .login-screen .envelope { font-size: 56px; display: block; margin-bottom: 1rem; animation: heartBeat 1.8s ease-in-out infinite; }
    @keyframes heartBeat {
      0%,100% { transform: scale(1); }
      14% { transform: scale(1.12); }
      28% { transform: scale(1); }
      42% { transform: scale(1.06); }
    }
    .login-screen h2 { font-family: 'Playfair Display', serif; color: #b0305a; font-size: 22px; margin-bottom: 0.25rem; }
    .login-screen p { font-size: 13px; color: #d07090; margin-bottom: 1.5rem; }
    .name-btn {
      display: block; width: 100%; padding: 12px;
      border-radius: 12px; border: 1.5px solid #f0b0c8;
      background: #fff; font-family: 'Lato', sans-serif;
      font-size: 15px; font-weight: 600; color: #b0305a;
      cursor: pointer; margin-bottom: 10px;
      transition: background 0.15s, transform 0.1s;
    }
    .name-btn:hover { background: #ffe0ee; transform: scale(1.02); }
    .status-msg { font-size: 12px; color: #e07090; margin-top: 0.5rem; min-height: 18px; }
    .chat-screen {
      display: none; flex-direction: column;
      width: 340px; height: 92vh; max-height: 680px;
      position: relative; z-index: 10;
    }
    .chat-header {
      background: linear-gradient(135deg, #e0609a, #b0305a);
      border-radius: 20px 20px 0 0; padding: 1rem 1.2rem;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 20px rgba(180,40,80,0.3);
    }
    .chat-header .avatar { font-size: 28px; }
    .chat-header .info { flex: 1; }
    .chat-header .info .name { font-family: 'Playfair Display', serif; color: #fff; font-size: 16px; font-weight: 600; }
    .chat-header .info .status { font-size: 11px; color: rgba(255,255,255,0.75); }
    .chat-header .logo { font-size: 18px; }
    .messages-area {
      flex: 1; background: #fff8fa; padding: 1rem;
      overflow-y: auto; display: flex; flex-direction: column;
      gap: 10px; scrollbar-width: thin; scrollbar-color: #f0b0c8 transparent;
    }
    .msg-row { display: flex; align-items: flex-end; gap: 6px; }
    .msg-row.mine { flex-direction: row-reverse; }
    .msg-avatar { font-size: 20px; flex-shrink: 0; }
    .msg-bubble {
      max-width: 75%; padding: 8px 12px; border-radius: 16px;
      font-size: 13.5px; line-height: 1.6;
      font-family: 'Playfair Display', serif; font-style: italic;
      animation: bubbleIn 0.3s cubic-bezier(.36,.07,.19,.97);
      word-break: break-word;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: scale(0.85) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .msg-row.theirs .msg-bubble {
      background: #fff; color: #7a304e;
      border: 1px solid #f5c0d0; border-bottom-left-radius: 4px;
    }
    .msg-row.mine .msg-bubble {
      background: linear-gradient(135deg, #e0609a, #c04070);
      color: #fff; border-bottom-right-radius: 4px;
    }
    .msg-time { font-size: 10px; color: #c0a0b0; margin-top: 2px; font-style: normal; font-family: 'Lato', sans-serif; }
    .msg-row.mine .msg-time { text-align: right; }
    .msg-sender { font-size: 10px; color: #e07090; font-weight: 600; font-family: 'Lato', sans-serif; font-style: normal; margin-bottom: 2px; }
    .input-area {
      background: #fff0f4; border-top: 1px solid #f5c0d0;
      border-radius: 0 0 20px 20px; padding: 0.75rem 1rem;
      display: flex; gap: 8px; align-items: center;
    }
    .input-area input {
      flex: 1; padding: 10px 14px; border-radius: 20px;
      border: 1.5px solid #f0b0c8; background: #fff;
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 13px; color: #7a304e; outline: none;
      transition: border-color 0.2s;
    }
    .input-area input::placeholder { color: #e0a0b8; }
    .input-area input:focus { border-color: #e0609a; }
    .btn-send {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #e0609a, #c04070);
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s; flex-shrink: 0;
    }
    .btn-send:hover { transform: scale(1.1); }
    .btn-send:active { transform: scale(0.95); }
    .empty-state {
      text-align: center; color: #d0a0b8; font-size: 13px;
      font-family: 'Playfair Display', serif; font-style: italic; margin: auto;
    }
    .empty-state .big { font-size: 36px; display: block; margin-bottom: 0.5rem; }
    .error-banner {
      background: #ffe0e0; color: #c04040; font-size: 12px;
      padding: 6px 12px; text-align: center; border-top: 1px solid #f5c0c0;
    }
  </style>
</head>
<body>
<div class="bg-hearts" id="bgHearts"></div>
<div class="login-screen" id="loginScreen">
  <span class="envelope">💌</span>
  <h2>Heart Letter</h2>
  <p>เลือกชื่อของคุณเพื่อเข้าสู่ห้องแชท</p>
  <button class="name-btn" onclick="login('Bobby', '🌹')">🌹 Bobby</button>
  <button class="name-btn" onclick="login('My Love', '💗')">💗 My Love</button>
  <div class="status-msg" id="loginStatus"></div>
</div>
<div class="chat-screen" id="chatScreen">
  <div class="chat-header">
    <div class="avatar" id="otherAvatar">💗</div>
    <div class="info">
      <div class="name" id="otherName">...</div>
      <div class="status" id="onlineStatus">online ✨</div>
    </div>
    <div class="logo">💌</div>
  </div>
  <div class="messages-area" id="messagesArea">
    <div class="empty-state">
      <span class="big">💌</span>
      ยังไม่มีข้อความ<br>เริ่มบทสนทนาได้เลย...
    </div>
  </div>
  <div id="errorBanner"></div>
  <div class="input-area">
    <input type="text" id="msgInput" placeholder="พิมพ์ข้อความ..." maxlength="300" />
    <button class="btn-send" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://oebnvqxwizqwbwdhadpa.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_eBPFiVX8peBm-yCcAQ_G2g_yflBmTYB';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);
  const users = { 'Bobby': { avatar: '🌹' }, 'My Love': { avatar: '💗' } };
  let myName = '';

  async function login(name) {
    document.getElementById('loginStatus').textContent = 'กำลังเชื่อมต่อ...';
    myName = name;
    const otherName = Object.keys(users).find(n => n !== name);
    document.getElementById('otherName').textContent = otherName;
    document.getElementById('otherAvatar').textContent = users[otherName].avatar;
    const ok = await loadMessages();
    if (ok !== false) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'flex';
      subscribeMessages();
    } else {
      document.getElementById('loginStatus').textContent = '❌ เชื่อมต่อไม่ได้ กรุณาลองใหม่';
    }
  }

  async function loadMessages() {
    try {
      const { data, error } = await db.from('messages').select('*').order('created_at', { ascending: true });
      if (error) { showError('โหลดข้อความไม่ได้: ' + error.message); return false; }
      const area = document.getElementById('messagesArea');
      if (data && data.length > 0) { area.innerHTML = ''; data.forEach(renderMessage); scrollToBottom(); }
      return true;
    } catch (e) { showError('เกิดข้อผิดพลาด: ' + e.message); return false; }
  }

  function subscribeMessages() {
    db.channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const area = document.getElementById('messagesArea');
        if (area.querySelector('.empty-state')) area.innerHTML = '';
        renderMessage(payload.new);
        scrollToBottom();
      })
      .subscribe(status => {
        if (status === 'SUBSCRIBED') document.getElementById('onlineStatus').textContent = 'online ✨';
        else if (status === 'CHANNEL_ERROR') document.getElementById('onlineStatus').textContent = 'การเชื่อมต่อมีปัญหา';
      });
  }

  function renderMessage(msg) {
    const area = document.getElementById('messagesArea');
    const isMine = msg.sender === myName;
    const avatar = users[msg.sender]?.avatar || '💬';
    const time = new Date(msg.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    const row = document.createElement('div');
    row.className = `msg-row ${isMine ? 'mine' : 'theirs'}`;
    row.innerHTML = `
      <div class="msg-avatar">${avatar}</div>
      <div>
        ${!isMine ? `<div class="msg-sender">${escapeHtml(msg.sender)}</div>` : ''}
        <div class="msg-bubble">${escapeHtml(msg.message)}</div>
        <div class="msg-time">${time}</div>
      </div>`;
    area.appendChild(row);
  }

  async function sendMessage() {
    const inp = document.getElementById('msgInput');
    const text = inp.value.trim();
    if (!text) return;
    const btn = document.getElementById('sendBtn');
    btn.disabled = true; inp.value = '';
    try {
      const { error } = await db.from('messages').insert({ sender: myName, message: text });
      if (error) { showError('ส่งไม่ได้: ' + error.message); inp.value = text; }
    } catch (e) { showError('เกิดข้อผิดพลาด: ' + e.message); inp.value = text; }
    finally { btn.disabled = false; inp.focus(); }
  }

  function showError(msg) {
    const b = document.getElementById('errorBanner');
    b.innerHTML = `<div class="error-banner">⚠️ ${msg}</div>`;
    setTimeout(() => b.innerHTML = '', 5000);
  }
  function scrollToBottom() { const a = document.getElementById('messagesArea'); a.scrollTop = a.scrollHeight; }
  function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  const bgEmojis = ['❤️','💗','🌸','✨','💝','💖','🩷'];
  function spawnBgHeart() {
    const c = document.getElementById('bgHearts');
    const el = document.createElement('div');
    el.className = 'bg-heart';
    el.textContent = bgEmojis[Math.floor(Math.random() * bgEmojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (12 + Math.random() * 18) + 'px';
    const dur = 7 + Math.random() * 8;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random() * 2) + 's';
    c.appendChild(el);
    setTimeout(() => el.remove(), (dur + 2) * 1000);
  }
  setInterval(spawnBgHeart, 900);
  for (let i = 0; i < 5; i++) setTimeout(spawnBgHeart, i * 400);
</script>
</body>
</html>
