<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💌 Heart Letter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #1a0a10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
    }

    /* ---- floating hearts background ---- */
    .bg-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-heart {
      position: absolute;
      font-size: 18px;
      opacity: 0;
      animation: bgFloat linear infinite;
    }

    @keyframes bgFloat {
      0%   { transform: translateY(110vh) rotate(0deg) scale(0.5); opacity: 0; }
      10%  { opacity: 0.35; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-10vh) rotate(360deg) scale(1.1); opacity: 0; }
    }

    /* ---- card ---- */
    .card {
      position: relative;
      background: linear-gradient(145deg, #fff0f4 0%, #fde0ea 100%);
      border-radius: 24px;
      width: 340px;
      padding: 2rem 1.8rem 1.8rem;
      text-align: center;
      border: 1.5px solid #f7b8cc;
      box-shadow:
        0 0 0 6px rgba(220,80,120,0.08),
        0 20px 60px rgba(180,40,80,0.25);
      overflow: hidden;
      z-index: 10;
    }

    /* sparkle particles inside card */
    .sparks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e75480;
      opacity: 0;
      animation: sparkAnim ease-out forwards;
    }

    @keyframes sparkAnim {
      0%   { transform: translate(0,0) scale(1); opacity: 0.9; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    /* envelope icon */
    .envelope {
      font-size: 54px;
      display: block;
      margin-bottom: 0.4rem;
      animation: heartBeat 1.8s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      14%  { transform: scale(1.12); }
      28%  { transform: scale(1); }
      42%  { transform: scale(1.06); }
      56%  { transform: scale(1); }
    }

    /* heading */
    .to-name {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      color: #b0305a;
      margin-bottom: 2px;
      transition: color 0.2s;
    }

    .tagline {
      font-size: 12px;
      color: #d07090;
      letter-spacing: 0.08em;
      margin-bottom: 1.2rem;
    }

    /* message display */
    .message-display {
      background: #fff;
      border-radius: 14px;
      padding: 1rem 1.1rem;
      border: 1px solid #f5c0d0;
      min-height: 90px;
      text-align: left;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 14px;
      color: #7a304e;
      line-height: 1.75;
      word-break: break-word;
      white-space: pre-wrap;
      transition: opacity 0.3s;
    }

    /* hearts row */
    .hearts-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      margin: 0.9rem 0 0.25rem;
      min-height: 28px;
    }

    .hearts-row span {
      font-size: 18px;
      animation: popIn 0.3s cubic-bezier(.36,.07,.19,.97);
      display: inline-block;
    }

    @keyframes popIn {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.3); }
      100% { transform: scale(1); opacity: 1; }
    }

    .heart-count {
      font-size: 11px;
      color: #e07090;
      margin-bottom: 1rem;
    }

    /* controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1.5px solid #f0b0c8;
      background: #fff;
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      color: #7a304e;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]::placeholder { color: #e0a0b8; }
    input[type="text"]:focus { border-color: #e0609a; }

    .btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }
    .btn:active { transform: scale(0.96); }

    .btn-send {
      background: #e0609a;
      color: #fff;
      white-space: nowrap;
    }
    .btn-send:hover { background: #c04070; }

    .btn-heart {
      background: #fde0ea;
      color: #e0609a;
      border: 1.5px dashed #f0b0c8;
      padding: 8px 12px;
      font-size: 16px;
    }
    .btn-heart:hover { background: #fcc0d8; }

    /* messages list */
    .msg-list {
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 0.8rem;
      scrollbar-width: thin;
      scrollbar-color: #f0b0c8 transparent;
    }

    .msg-bubble {
      background: #fff8fa;
      border-radius: 10px;
      padding: 7px 10px;
      text-align: left;
      border: 1px solid #f5c0d0;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-bubble:hover { background: #ffe0ee; border-color: #e07090; }
    .msg-bubble.active { background: #ffe0ee; border-color: #e0609a; }

    .bubble-from {
      font-size: 10px;
      color: #e07090;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .bubble-text {
      font-size: 12.5px;
      color: #7a304e;
      line-height: 1.5;
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }

    /* divider */
    .divider {
      border: none;
      border-top: 1px solid #f5c0d0;
      margin: 1rem 0 0.75rem;
    }
  </style>
</head>
<body>

  <!-- floating background hearts -->
  <div class="bg-hearts" id="bgHearts"></div>

  <div class="card">
    <div class="sparks" id="sparks"></div>

    <span class="envelope">💌</span>
    <div class="to-name" id="toName">To: My Love</div>
    <div class="tagline">a little note just for you ♡</div>

    <div class="message-display" id="msgDisplay">
      Click a message below to show it here, or write your own...
    </div>

    <div class="hearts-row" id="heartsRow">
      <span>🤍</span><span>💗</span><span>❤️</span>
    </div>
    <div class="heart-count" id="heartCount">3 hearts sent</div>

    <div class="controls">
      <div class="input-row">
        <input type="text" id="recipientInput" placeholder="To: (ชื่อ)" value="My Love" maxlength="30" />
      </div>
      <div class="input-row">
        <input type="text" id="msgInput" placeholder="เขียนข้อความของคุณ..." maxlength="150" />
        <button class="btn btn-send" onclick="addMessage()">ส่ง 💌</button>
      </div>
      <div class="input-row" style="justify-content: center;">
        <button class="btn btn-heart" onclick="addHeart()">+ ❤️ เพิ่มหัวใจ</button>
      </div>
    </div>

    <hr class="divider" />
    <div class="msg-list" id="msgList"></div>
  </div>

  <script>
    // ---- default messages ----
    const defaultMsgs = [
      { from: "💌 Quick note", text: "Every moment with you feels like magic. You make my world brighter. 🌟" },
      { from: "💌 Sweet thought", text: "I fall for you a little more every single day. ❤️" },
      { from: "💌 Reminder", text: "You are loved, always and forever. Don't you forget it. 🌸" }
    ];

    let messages = [...defaultMsgs];
    let heartCount = 3;
    const heartEmojis = ["💗","❤️","🤍","💓","💖","💝","🌸","✨","🩷","💞"];
    let heartIdx = 3;

    // ---- render message list ----
    function renderMessages() {
      const list = document.getElementById('msgList');
      list.innerHTML = '';
      messages.forEach((m, i) => {
        const el = document.createElement('div');
        el.className = 'msg-bubble';
        el.innerHTML = `<div class="bubble-from">${m.from}</div><div class="bubble-text">${m.text}</div>`;
        el.onclick = () => showMsg(i, el);
        list.appendChild(el);
      });
    }

    // ---- show message in display box ----
    function showMsg(i, el) {
      document.querySelectorAll('.msg-bubble').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      const display = document.getElementById('msgDisplay');
      display.style.opacity = '0';
      setTimeout(() => {
        display.textContent = messages[i].text;
        display.style.opacity = '1';
      }, 200);
      triggerSparks();
    }

    // ---- add new message ----
    function addMessage() {
      const inp = document.getElementById('msgInput');
      const recipient = document.getElementById('recipientInput').value.trim() || 'My Love';
      const text = inp.value.trim();
      if (!text) return;
      messages.push({ from: `💌 To: ${recipient}`, text });
      inp.value = '';
      renderMessages();
      document.getElementById('toName').textContent = `To: ${recipient}`;
      setTimeout(() => {
        const items = document.querySelectorAll('.msg-bubble');
        const last = items[items.length - 1];
        showMsg(messages.length - 1, last);
        last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 50);
    }

    // ---- add heart ----
    function addHeart() {
      heartCount++;
      document.getElementById('heartCount').textContent = heartCount + ' hearts sent';
      const row = document.getElementById('heartsRow');
      const span = document.createElement('span');
      span.textContent = heartEmojis[heartIdx % heartEmojis.length];
      heartIdx++;
      row.appendChild(span);
      if (row.children.length > 10) row.removeChild(row.firstChild);
      triggerSparks();
    }

    // ---- spark particles inside card ----
    function triggerSparks() {
      const container = document.getElementById('sparks');
      const colors = ['#e75480','#f7b8cc','#d04070','#ff8fab','#ffb3c6'];
      for (let i = 0; i < 10; i++) {
        const el = document.createElement('div');
        el.className = 'spark';
        const x = 20 + Math.random() * 60;
        const y = 20 + Math.random() * 60;
        const dx = (Math.random() - 0.5) * 80 + 'px';
        const dy = (Math.random() - 0.5) * 80 + 'px';
        el.style.cssText = `left:${x}%; top:${y}%; background:${colors[i%colors.length]};
          --dx:${dx}; --dy:${dy}; animation-duration:${0.5 + Math.random() * 0.5}s;
          animation-delay:${Math.random() * 0.2}s;`;
        container.appendChild(el);
        setTimeout(() => el.remove(), 1000);
      }
    }

    // ---- floating background hearts ----
    function spawnBgHeart() {
      const container = document.getElementById('bgHearts');
      const emojis = ['❤️','💗','🌸','✨','💝','💖','🩷'];
      const el = document.createElement('div');
      el.className = 'bg-heart';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.fontSize = (12 + Math.random() * 20) + 'px';
      const dur = 6 + Math.random() * 8;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (Math.random() * 3) + 's';
      container.appendChild(el);
      setTimeout(() => el.remove(), (dur + 3) * 1000);
    }

    // spawn bg hearts continuously
    setInterval(spawnBgHeart, 800);
    for (let i = 0; i < 6; i++) setTimeout(spawnBgHeart, i * 300);

    // ---- live name update ----
    document.getElementById('recipientInput').addEventListener('input', function () {
      const val = this.value.trim() || 'My Love';
      document.getElementById('toName').textContent = `To: ${val}`;
    });

    // send on Enter
    document.getElementById('msgInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addMessage();
    });

    // ---- init ----
    renderMessages();
  </script>
</body>
</html>
